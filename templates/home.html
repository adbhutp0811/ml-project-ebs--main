<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .login {
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        .login > h1 {
            text-align: center;
            font-size: 28px;
            color: #333;
            margin-bottom: 25px;
        }

        legend {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 25px;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            background: #f9fafc;
            color: #333;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        select.form-control {
            cursor: pointer;
        }

        .form-control::placeholder {
            color: #999;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
            border-left: 5px solid #667eea;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #333;
            animation: slideUp 0.5s ease;
        }

        .result h2 {
            margin-top: 10px;
            color: #4f46e5;
            font-size: 32px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .login {
                padding: 25px 20px;
            }

            .login > h1 {
                font-size: 22px;
            }

            legend {
                font-size: 17px;
            }

            .form-control {
                padding: 12px;
            }

            .btn-primary {
                font-size: 14px;
            }

            .result {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>🎓 Student Exam Performance Indicator</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <legend>Student Exam Performance Prediction</legend>

            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select class="form-control" name="gender" required>
                    <option selected disabled value="">Select your Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <!-- Ethnicity -->
            <div class="mb-3">
                <label class="form-label">Race or Ethnicity</label>

                <select class="form-control" name="ethnicity" required>
                    <option selected disabled value="">Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <!-- Parent Education -->
            <div class="mb-3">
                <label class="form-label">Parental Level of Education</label>

                <select class="form-control"
                        name="parental_level_of_education"
                        required>

                    <option selected disabled value="">
                        Select Parent Education
                    </option>

                    <option value="associate's degree">
                        Associate's Degree
                    </option>

                    <option value="bachelor's degree">
                        Bachelor's Degree
                    </option>

                    <option value="high school">
                        High School
                    </option>

                    <option value="master's degree">
                        Master's Degree
                    </option>

                    <option value="some college">
                        Some College
                    </option>

                    <option value="some high school">
                        Some High School
                    </option>

                </select>
            </div>

            <!-- Lunch -->
            <div class="mb-3">
                <label class="form-label">Lunch Type</label>

                <select class="form-control" name="lunch" required>
                    <option selected disabled value="">Select Lunch Type</option>
                    <option value="free/reduced">Free/Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <!-- Test Preparation -->
            <div class="mb-3">
                <label class="form-label">Test Preparation Course</label>

                <select class="form-control"
                        name="test_preparation_course"
                        required>

                    <option selected disabled value="">
                        Select Test Course
                    </option>

                    <option value="none">None</option>
                    <option value="completed">Completed</option>

                </select>
            </div>

            <!-- Writing Score -->
            <div class="mb-3">
                <label class="form-label">
                    Writing Score (Out of 100)
                </label>

                <input
                    class="form-control"
                    type="number"
                    name="writing_score"
                    placeholder="Enter your Writing Score"
                    min="0"
                    max="100"
                    required
                >
            </div>

            <!-- Reading Score -->
            <div class="mb-3">
                <label class="form-label">
                    Reading Score (Out of 100)
                </label>

                <input
                    class="form-control"
                    type="number"
                    name="reading_score"
                    placeholder="Enter your Reading Score"
                    min="0"
                    max="100"
                    required
                >
            </div>

            <!-- Submit Button -->
            <div class="mb-3">
                <input
                    class="btn-primary"
                    type="submit"
                    value="🚀 Predict Your Maths Score"
                >
            </div>

        </form>

        <!-- Prediction Result -->
        {% if results is defined and results is not none %}

        <div class="result">
            🎯 Predicted Mathematics Score

            <h2>{{ results }} / 100</h2>
        </div>

        {% endif %}

    </div>

</body>
</html>
